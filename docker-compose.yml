services:
  postgres:
    image: postgres:15-alpine
    container_name: demo-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${APP_DB_NAME:-appdb}
      - APP_DB_NAME=${APP_DB_NAME:-appdb}
      - APP_DB_USER=${APP_DB_USER:-app}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD:-app_password}
      - BARMAN_DB_USER=${BARMAN_DB_USER:-barman}
      - BARMAN_DB_PASSWORD=${BARMAN_DB_PASSWORD:-barman_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - wal-archive:/wal_archive
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /wal_archive/%f && (cp %p /wal_archive/%f && chmod 0644 /wal_archive/%f)
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - wal_keep_size=64MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${APP_DB_NAME:-appdb}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  barman:
    build:
      context: ./barman
      dockerfile: Dockerfile
    container_name: demo-barman
    environment:
      - BARMAN_SERVER_NAME=main
      - BARMAN_PG_HOST=postgres
      - BARMAN_PG_PORT=5432
      - BARMAN_PG_DBNAME=${APP_DB_NAME:-appdb}
      - BARMAN_PG_USER=${BARMAN_DB_USER:-barman}
      - BARMAN_PG_PASSWORD=${BARMAN_DB_PASSWORD:-barman_password}
      - BARMAN_RETENTION_POLICY=RECOVERY WINDOW OF 7 DAYS
    volumes:
      - barman-data:/var/lib/barman
      - wal-archive:/wal_archive
    depends_on:
      - postgres
    networks:
      - app-network

  # Container 1: Database Server (HTTPS)
  # PostgreSQL (default) / SQLite (fallback) database with MVC architecture and nice UI
  # Multi-factor authentication: Password + TOTP 2FA + Security Question
  # Runs on HTTPS with self-signed certificate
  database-server:
    build:
      context: .
      dockerfile: database_server/Dockerfile
    container_name: database-server
    ports:
      - "5002:5000"
    environment:
      - FLASK_ENV=development
      - SECRET_KEY=${DATABASE_SERVER_SECRET_KEY:-demo-database-server-secret-change-me}
      - APP_ENV=demo
      - ENABLE_TOTP_TEST_ENDPOINT=true
      - ENABLE_QUERY_CONSOLE=true
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://${APP_DB_USER:-app}:${APP_DB_PASSWORD:-app_password}@postgres:5432/${APP_DB_NAME:-appdb}
      - PORT=5000
    volumes:
      - db-data:/app/data
      - ./database_server/certs:/app/certs:ro
    depends_on:
      - postgres
      - redis
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Container 2: Proxy Clone / Gateway
  # - Own HOME interface for end users to write queries
  # - Can clone/mirror the original database server UI dynamically
  # - Stores credentials and session cookies (simulates breach)
  # - Handles multi-step auth (password + 2FA + security question)
  # - Connects to database server via HTTPS
  proxy-clone:
    build:
      context: .
      dockerfile: proxy_clone/Dockerfile
    container_name: proxy-clone
    ports:
      - "8080:8080"
    environment:
      - FLASK_ENV=development
      - SECRET_KEY=${PROXY_CLONE_SECRET_KEY:-demo-proxy-clone-secret-change-me}
      - APP_ENV=demo
      - PROXY_FEATURES_ENABLED=true
      - DATABASE_SERVER_URL=https://database-server:5000
      - SSL_VERIFY=false
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - database-server
      - redis
    networks:
      - app-network
    restart: unless-stopped
    volumes:
      - ./proxy_clone/certs:/app/certs:ro

  redis:
    image: redis:7-alpine
    container_name: demo-redis
    ports:
      - "6379:6379"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
  postgres-data:
  barman-data:
  wal-archive:
