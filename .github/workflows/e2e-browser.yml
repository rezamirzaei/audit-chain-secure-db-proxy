name: Docker Browser E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/e2e-browser.yml"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - "database_server/**"
      - "proxy_clone/**"
      - "nginx/**"
      - "postgres/**"
      - "scripts/e2e_docker_browser.sh"
      - "scripts/generate_demo_certs.sh"
      - "e2e/**"

jobs:
  docker-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps (for helper scripts / local tooling parity)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r database_server/requirements.txt -r proxy_clone/requirements.txt -r requirements-dev.txt

      - name: Run Docker + Playwright E2E suite
        run: |
          bash scripts/e2e_docker_browser.sh

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: e2e/test-results
          if-no-files-found: ignore
