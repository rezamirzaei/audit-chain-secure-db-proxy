<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Verification - DataVault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1d21 0%, #212529 50%, #2c3034 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            padding: 2rem;
        }

        .auth-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 2.5rem;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header .logo {
            font-size: 3rem;
            color: #198754;
            margin-bottom: 1rem;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .step {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #dee2e6;
        }

        .step.completed {
            background: #198754;
        }

        .step.active {
            background: #0d6efd;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .form-control {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 2px solid #dee2e6;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13,110,253,0.15);
        }

        .btn-verify {
            padding: 0.75rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
        }

        .security-question {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            border-left: 4px solid #0d6efd;
        }

        .security-question .label {
            font-size: 0.8rem;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .security-question .question {
            font-weight: 600;
            color: #212529;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <i class="bi bi-question-circle-fill"></i>
                </div>
                <h4>Security Verification</h4>
                <p class="text-muted">Final Step - 3 of 3</p>
            </div>

            <div class="step-indicator">
                <div class="step completed" title="Password"></div>
                <div class="step completed" title="2FA Code"></div>
                <div class="step active" title="Security Question"></div>
            </div>

            {% if error %}
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endif %}

            <div class="text-center mb-4">
                <p class="text-muted mb-1">Authenticating as</p>
                <h5 class="mb-0"><i class="bi bi-person-circle me-2"></i>{{ username }}</h5>
            </div>

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div class="security-question">
                    <div class="label">Security Question</div>
                    <div class="question"><i class="bi bi-chat-left-quote me-2"></i>{{ question }}</div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Your Answer</label>
                    <input type="text" class="form-control" name="security_answer"
                           placeholder="Enter your answer" required autofocus>
                    <div class="form-text">
                        Answer is case-insensitive
                    </div>
                </div>

                <button type="submit" class="btn btn-success btn-verify w-100">
                    <i class="bi bi-unlock me-2"></i>Complete Login
                </button>
            </form>

            <hr class="my-4">

            <div class="text-center">
                <a href="{{ url_for('login') }}" class="text-decoration-none">
                    <i class="bi bi-arrow-left me-1"></i> Start Over
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
