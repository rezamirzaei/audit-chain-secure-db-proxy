services:
  postgres:
    image: postgres:15-alpine
    container_name: prod-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?set POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      - POSTGRES_DB=${APP_DB_NAME:?set APP_DB_NAME}
      - APP_DB_NAME=${APP_DB_NAME:?set APP_DB_NAME}
      - APP_DB_USER=${APP_DB_USER:?set APP_DB_USER}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
      - BARMAN_DB_USER=${BARMAN_DB_USER:?set BARMAN_DB_USER}
      - BARMAN_DB_PASSWORD=${BARMAN_DB_PASSWORD:?set BARMAN_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - wal-archive:/wal_archive
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /wal_archive/%f && (cp %p /wal_archive/%f && chmod 0644 /wal_archive/%f)
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - wal_keep_size=64MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?set POSTGRES_USER} -d ${APP_DB_NAME:?set APP_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  barman:
    build:
      context: ./barman
      dockerfile: Dockerfile
    container_name: prod-barman
    environment:
      - BARMAN_SERVER_NAME=main
      - BARMAN_PG_HOST=postgres
      - BARMAN_PG_PORT=5432
      - BARMAN_PG_DBNAME=${APP_DB_NAME:?set APP_DB_NAME}
      - BARMAN_PG_USER=${BARMAN_DB_USER:?set BARMAN_DB_USER}
      - BARMAN_PG_PASSWORD=${BARMAN_DB_PASSWORD:?set BARMAN_DB_PASSWORD}
      - BARMAN_RETENTION_POLICY=RECOVERY WINDOW OF 7 DAYS
    volumes:
      - barman-data:/var/lib/barman
      - wal-archive:/wal_archive
    depends_on:
      - postgres
    networks:
      - app-network

  database-server:
    build:
      context: ./database_server
      dockerfile: Dockerfile
    container_name: database-server
    environment:
      - APP_ENV=production
      - SECRET_KEY=${DATABASE_SERVER_SECRET_KEY:?set DATABASE_SERVER_SECRET_KEY}
      - PORT=5000
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://${APP_DB_USER:?set APP_DB_USER}:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@postgres:5432/${APP_DB_NAME:?set APP_DB_NAME}
      - ENABLE_TOTP_TEST_ENDPOINT=false
      - ENABLE_QUERY_CONSOLE=false
      - TRUST_PROXY=true
    volumes:
      - db-data:/app/data
    expose:
      - "5000"
    depends_on:
      - postgres
      - redis
    networks:
      - app-network
    command: ["gunicorn", "-c", "gunicorn.conf.py", "app:app"]

  proxy-clone:
    build:
      context: ./proxy_clone
      dockerfile: Dockerfile
    container_name: proxy-clone
    environment:
      - APP_ENV=production
      - SECRET_KEY=${PROXY_CLONE_SECRET_KEY:?set PROXY_CLONE_SECRET_KEY}
      - DATABASE_SERVER_URL=http://database-server:5000
      - SSL_VERIFY=true
      - REDIS_URL=redis://redis:6379/1
      - PROXY_FEATURES_ENABLED=${PROXY_FEATURES_ENABLED:-false}
      - TRUST_PROXY=true
    expose:
      - "8080"
    depends_on:
      - database-server
      - redis
    networks:
      - app-network
    command: ["gunicorn", "-c", "gunicorn.conf.py", "app:app"]

  redis:
    image: redis:7-alpine
    container_name: prod-redis
    networks:
      - app-network

  nginx:
    image: nginx:1.25-alpine
    container_name: app-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - database-server
      - proxy-clone
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
  postgres-data:
  barman-data:
  wal-archive:
