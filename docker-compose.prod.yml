services:
  database-server:
    build:
      context: ./database_server
      dockerfile: Dockerfile
    container_name: database-server
    environment:
      - APP_ENV=production
      - SECRET_KEY=database-server-secret-key-change-in-production
      - PORT=5000
      - REDIS_URL=redis://redis:6379/0
      - ENABLE_TOTP_TEST_ENDPOINT=false
      - ENABLE_QUERY_CONSOLE=false
      - TRUST_PROXY=true
    volumes:
      - db-data:/app/data
    expose:
      - "5000"
    depends_on:
      - redis
    networks:
      - app-network
    command: ["gunicorn", "-c", "gunicorn.conf.py", "app:app"]

  proxy-clone:
    build:
      context: ./proxy_clone
      dockerfile: Dockerfile
    container_name: proxy-clone
    environment:
      - APP_ENV=production
      - SECRET_KEY=proxy-clone-secret-key-change-in-production
      - DATABASE_SERVER_URL=http://database-server:5000
      - SSL_VERIFY=true
      - REDIS_URL=redis://redis:6379/1
      - PROXY_FEATURES_ENABLED=true
      - TRUST_PROXY=true
    expose:
      - "8080"
    depends_on:
      - database-server
      - redis
    networks:
      - app-network
    command: ["gunicorn", "-c", "gunicorn.conf.py", "app:app"]

  redis:
    image: redis:7-alpine
    container_name: prod-redis
    networks:
      - app-network

  nginx:
    image: nginx:1.25-alpine
    container_name: app-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - database-server
      - proxy-clone
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
