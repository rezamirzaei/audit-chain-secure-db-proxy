[project]
name = "pythonproject9"
version = "0.1.0"
description = "Database server and proxy-clone demo system with MFA, auditing, and DR tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.0.0",
    "Werkzeug==3.0.1",
    "pyOpenSSL==23.3.0",
    "argon2-cffi==23.1.0",
    "Flask-Session==0.8.0",
    "cachelib>=0.13,<1",
    "redis==5.0.1",
    "gunicorn==21.2.0",
    "psycopg2-binary==2.9.9",
    "requests==2.31.0",
    "urllib3>=2,<3",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.9.2",
    "mypy==1.19.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
namespace_packages = true
exclude = [
    "^\\.venv/",
    "^\\.pytest_cache/",
    "^\\.ruff_cache/",
]

[[tool.mypy.overrides]]
module = [
    "flask_session",
    "psycopg2",
    "psycopg2.*",
]
ignore_missing_imports = true
